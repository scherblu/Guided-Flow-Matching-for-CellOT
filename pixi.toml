[workspace]
authors = ["scherblu <Lucas Scherberger <lucas.scherberger@gmail.com>>"]
channels = ["conda-forge"]
name = "Guided-Flow-Matching-for-CellOT"
platforms = ["linux-64"]
version = "0.1.0"

[activation.env]
# Ignore ~/.local user site-packages: a stale user-site `numba` (NumPy<=2.3) otherwise shadows
# the env's numba 0.65.1 and breaks `import umap`, silently downgrading bio4i UMAP overlays to PCA.
PYTHONNOUSERSITE = "1"

[tasks]
install-kernel = "python -m ipykernel install --user --name=guided_flows --display-name='Guided Flows (pixi)'"

[dependencies]
python = "3.12.*"
scanpy = "*"
pytorch = ">=2.12.0,<3"
anndata = ">=0.12.17,<0.13"
pot = ">=0.9.6.post1,<0.10"
scikit-learn = ">=1.9.0,<2"
matplotlib = ">=3.11.0,<4"
pyyaml = ">=6.0.3,<7"
wandb = ">=0.27.2,<0.28"

[pypi-dependencies]
torchdyn = ">=1.0.6, <2"
guided_flow = { path = "synthetic", editable = true }
